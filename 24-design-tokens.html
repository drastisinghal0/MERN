<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Design Tokens Demo">
<title>Design Tokens</title>

<style>
:root{
    --color-primary:#2563eb;
    --color-primary-dark:#1d4ed8;
    --color-accent:#f59e0b;
    --color-surface:#ffffff;
    --color-bg:#f3f4f6;
    --color-text:#111827;
    --color-muted:#6b7280;

    --space-1:4px;
    --space-2:8px;
    --space-3:16px;
    --space-4:24px;

    --fs-sm:.9rem;
    --fs-base:1rem;
    --fs-lg:1.4rem;
    --fs-xl:2rem;

    --radius:10px;
    --shadow:0 4px 12px rgba(0,0,0,.15);
}

[data-theme="dark"]{
    --color-bg:#111827;
    --color-surface:#1f2937;
    --color-text:#f3f4f6;
    --color-muted:#d1d5db;
}

body{
    margin:0;
    padding:var(--space-4);
    font-family:Arial,sans-serif;
    background:var(--color-bg);
    color:var(--color-text);
    transition:.3s;
}

h1{
    font-size:var(--fs-xl);
}

h2{
    font-size:var(--fs-lg);
}

small{
    font-size:var(--fs-sm);
    color:var(--color-muted);
}

.card{
    background:var(--color-surface);
    padding:var(--space-4);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin:20px 0;
}

.btn{
    background:var(--color-primary);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:var(--radius);
    cursor:pointer;
}

.btn:hover{
    background:var(--color-primary-dark);
}

.btn-accent{
    background:var(--color-accent);
}

.swatches{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
}

.swatch{
    width:90px;
    height:60px;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:var(--radius);
    font-size:.8rem;
}
</style>
</head>

<body>

<h1>Design Token Sheet</h1>

<button class="btn"
onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark'">
Dark Theme
</button>

<div class="card">
<h2>Colours</h2>

<div class="swatches">
<div class="swatch" style="background:var(--color-primary)">Primary</div>
<div class="swatch" style="background:var(--color-primary-dark)">Dark</div>
<div class="swatch" style="background:var(--color-accent)">Accent</div>
<div class="swatch" style="background:var(--color-muted)">Muted</div>
</div>

</div>

<div class="card">
<h2>Typography</h2>
<p style="font-size:var(--fs-xl)">Extra Large</p>
<p style="font-size:var(--fs-lg)">Large</p>
<p>Normal Text</p>
<small>Small Text</small>
</div>

<div class="card">
<h2>Buttons</h2>
<button class="btn">Primary</button>
<button class="btn btn-accent">Accent</button>
</div>

</body>
</html>
