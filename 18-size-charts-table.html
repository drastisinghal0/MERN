<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18-size-chart-table</title>

<style>
table{
    width:80%;
    margin:auto;
    border-collapse:collapse;
}
caption{
    font-size:24px;
    font-weight:bold;
    margin:10px;
}
th,td{
    border:1px solid black;
    padding:10px;
    text-align:center;
}
thead{
    background:#333;
    color:white;
}
tbody tr:nth-child(even){
    background:#f2f2f2;
}
tfoot{
    background:#ddd;
    font-weight:bold;
}
</style>
</head>

<body>

<h1 style="text-align:center;">T-Shirt Size Chart</h1>

<table>

<caption>Product Size Chart</caption>

<thead>
<tr>
<th rowspan="2">Size</th>
<th colspan="2">Chest</th>
<th colspan="2">Length</th>
<th rowspan="2">Fit Weight</th>
</tr>

<tr>
<th>cm</th>
<th>inch</th>
<th>cm</th>
<th>inch</th>
</tr>
</thead>

<tbody>
<tr>
<th scope="row">S</th>
<td>92</td>
<td>36</td>
<td>68</td>
<td>27</td>
<td>55–62 kg</td>
</tr>

<tr>
<th scope="row">M</th>
<td>98</td>
<td>38.5</td>
<td>70</td>
<td>27.5</td>
<td>63–72 kg</td>
</tr>

<tr>
<th scope="row">L</th>
<td>104</td>
<td>41</td>
<td>72</td>
<td>28.5</td>
<td>73–82 kg</td>
</tr>

<tr>
<th scope="row">XL</th>
<td>110</td>
<td>43</td>
<td>74</td>
<td>29</td>
<td>83–92 kg</td>
</tr>

<tr>
<th scope="row">XXL</th>
<td>116</td>
<td>45.5</td>
<td>76</td>
<td>30</td>
<td>93–105 kg</td>
</tr>
</tbody>

<tfoot>
<tr>
<td colspan="6">
Tip: If you are between two sizes, choose the larger one.
</td>
</tr>
</tfoot>

</table>

</body>
</html>
