<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment 36 - Grid Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#eef2f7;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#222;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    max-width:1100px;
    margin:auto;
}

.gallery img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border-radius:12px;
    transition:.3s;
}

.gallery img:hover{
    transform:scale(1.05);
}

.item{
    overflow:hidden;
    border-radius:12px;
    background:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.wide{
    grid-column:span 2;
}

.tall{
    grid-row:span 2;
}

.big{
    grid-column:span 2;
    grid-row:span 2;
}

@media(max-width:768px){
.gallery{
    grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:500px){
.gallery{
    grid-template-columns:1fr;
}
.wide,
.tall,
.big{
    grid-column:auto;
    grid-row:auto;
}
}
</style>
</head>

<body>

<h1>Responsive Photo Gallery</h1>

<div class="gallery">

<div class="item big">
<img src="https://picsum.photos/600/600?1" alt="Image">
</div>

<div class="item">
<img src="https://picsum.photos/400/400?2" alt="Image">
</div>

<div class="item tall">
<img src="https://picsum.photos/400/700?3" alt="Image">
</div>

<div class="item">
<img src="https://picsum.photos/400/400?4" alt="Image">
</div>

<div class="item wide">
<img src="https://picsum.photos/700/400?5" alt="Image">
</div>

<div class="item">
<img src="https://picsum.photos/400/400?6" alt="Image">
</div>

<div class="item">
<img src="https://picsum.photos/400/400?7" alt="Image">
</div>

<div class="item wide">
<img src="https://picsum.photos/700/400?8" alt="Image">
</div>

</div>

</body>
</html>
