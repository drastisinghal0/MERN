<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Menu Bar</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:system-ui,sans-serif;
}

.menu{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#1d3557;
    padding:0 1.5rem;
    flex-wrap:wrap;
}

.menu_brand{
    color:#fff;
    font-weight:800;
    font-size:1.3rem;
    padding:1rem 0;
}

.menu_list{
    display:flex;
    list-style:none;
}

.menu_list a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:1rem 1rem;
    transition:background .2s;
}

.menu_list a:hover,
.menu_list a.active{
    background:#457b9d;
}

.menu_cta{
    margin-left:1rem;
    background:#e63946;
    color:#fff;
    padding:.5rem 1rem;
    border-radius:6px;
    text-decoration:none;
}

/* Responsive: stack on small screens */
@media (max-width:640px){

.menu{
    flex-direction:column;
    align-items:stretch;
    padding:0;
}

.menu_brand{
    text-align:center;
}

.menu_list{
    flex-direction:column;
    text-align:center;
}

.menu_cta{
    margin:.5rem;
    text-align:center;
}

}

main{
    padding:2rem;
}
</style>
</head>

<body>

<nav class="menu" aria-label="Main">

<div class="menu_brand">MyBrand</div>

<ul class="menu_list">
<li><a class="active" href="#">Home</a></li>
<li><a href="#">Services</a></li>
<li><a href="#">Portfolio</a></li>
<li><a href="#">Contact</a></li>
</ul>

<a class="menu_cta" href="#">Sign up</a>

</nav>

<main>
<h1>Resize the window to see the menu stack.</h1>
</main>

</body>
</html>
