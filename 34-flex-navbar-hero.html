<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment 34 - Responsive Navbar Hero</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f8f9fb;
    color:#222;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:#0f172a;
}

.logo{
    color:#fff;
    font-size:26px;
    font-weight:bold;
}

.nav-links{
    list-style:none;
    display:flex;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:white;
}

.nav-links a:hover{
    color:#38bdf8;
}

.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:70px 8%;
    gap:40px;
    flex-wrap:wrap;
}

.hero-text{
    flex:1;
}

.hero-text h1{
    font-size:48px;
    margin-bottom:20px;
}

.hero-text p{
    color:#555;
    line-height:1.7;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    gap:15px;
}

.btn{
    padding:12px 24px;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    border:2px solid #2563eb;
    color:#2563eb;
}

.hero-img{
    flex:1;
    text-align:center;
}

.hero-img img{
    width:100%;
    max-width:500px;
    border-radius:15px;
}

@media(max-width:768px){

.navbar{
    flex-direction:column;
    gap:15px;
}

.nav-links{
    flex-direction:column;
    align-items:center;
}

.hero{
    flex-direction:column-reverse;
    text-align:center;
}

.buttons{
    justify-content:center;
}

.hero-text h1{
    font-size:36px;
}
}
</style>
</head>

<body>

<nav class="navbar">
<div class="logo">SkillHub</div>

<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#">Services</a></li>
<li><a href="#">Projects</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<section class="hero">

<div class="hero-text">
<h1>Create Modern Websites Easily</h1>

<p>
Learn HTML, CSS and Flexbox by building beautiful responsive websites
that work on desktop, tablet and mobile devices.
</p>

<div class="buttons">
<a href="#" class="btn primary">Get Started</a>
<a href="#" class="btn secondary">Learn More</a>
</div>

</div>

<div class="hero-img">
<img src="https://picsum.photos/600/400" alt="Hero Image">
</div>

</section>

</body>
</html>
