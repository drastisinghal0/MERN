<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Product Grid</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#eef2f7;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    border-radius:10px;
    padding:15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:8px;
}

.card h3{
    margin:12px 0 8px;
}

.price{
    color:#0b8457;
    font-weight:bold;
    font-size:18px;
}
</style>
</head>

<body>

<h1>Product Grid</h1>
<p>Responsive layout using CSS Grid Auto-Fit.</p>

<div class="grid">

<div class="card">
<img src="https://picsum.photos/300?1" alt="">
<h3>Wireless Mouse</h3>
<p class="price">₹699</p>
</div>

<div class="card">
<img src="https://picsum.photos/300?2" alt="">
<h3>Bluetooth Speaker</h3>
<p class="price">₹1,299</p>
</div>

<div class="card">
<img src="https://picsum.photos/300?3" alt="">
<h3>Smart Watch</h3>
<p class="price">₹2,499</p>
</div>

<div class="card">
<img src="https://picsum.photos/300?4" alt="">
<h3>Headphones</h3>
<p class="price">₹1,999</p>
</div>

<div class="card">
<img src="https://picsum.photos/300?5" alt="">
<h3>Keyboard</h3>
<p class="price">₹899</p>
</div>

<div class="card">
<img src="https://picsum.photos/300?6" alt="">
<h3>Laptop Bag</h3>
<p class="price">₹1,499</p>
</div>

</div>

</body>
</html>
